<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eight Eyes and The Black Seal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="imgs/icons/Zari.png">
</head>

<body class="bodyFaee">
  <audio id="cityOst" autoplay loop>
    <source src="ost/FanfaresAndFlowers.mp3" type="audio/mp3">
  </audio>

  <button class="nav" id="musicBtn" onclick="toggleMusic()">Mute</button>
  <button class="nav mode" id="modeToggle">Main Story</button>

  <div class="mapbtn navbtn faeforest">
    <a href="forest.html"> <br>
      <button class="label"><img class="icons" src="imgs/icons/mori.png" alt="">
        <br>To Forest</button>
    </a>
  </div>

  <div class="mapbtn stable" data-scene="stable" onclick="handleLocation('stable')">
    <button class="label">
      <img class="icons" src="imgs/icons/animal_character_uma_ninjin.png" alt=""><br>
      Stable</button>
  </div>

  <div class="mapbtn festival" data-scene="festival" onclick="handleLocation('festival')">
    <button class="label">
      <img class="icons" src="imgs/icons/drink_sparkling_wine.png" alt=""><br>
      Festival</button>
  </div>

  <div class="mapbtn faeeRuins" data-scene="ruin" onclick="handleLocation('ruin')">
    <button class="label">
      <img class="icons" src="imgs/icons/landmark_kanjou_mokuchuuretsu.png" alt=""><br>
      Ruins</button>
  </div>

  <div class="mapbtn faeeCastle" data-scene="faecastle" onclick="handleLocation('faecastle')">
    <button class="label">
      <img class="icons" src="imgs/icons/building_europe_kojou.png" alt=""><br>
      Castle</button>
  </div>

  <div class="mapbtn faeeMarket" data-scene="faemarket" onclick="handleLocation('faemarket')">
    <button class="label">
      <img class="icons" src="imgs/icons/ichiba_marusye.png" alt=""><br>
      Market</button>
  </div>

</body>
<script>
  const audio = document.getElementById("cityOst");
  const button = document.getElementById("musicBtn");
  audio.volume = 0.5;
  function toggleMusic() {
    audio.muted = !audio.muted;
    button.textContent = audio.muted ? "Unmute" : "Mute";
    music.pause();
  }
  // STORY ORDER
  const mainStoryOrder = [
    "inn",
    "quest",
    "townsquare",
    "ravine",
    "faemarket_1",
    "festival_1",
    "festival_2",
    "faecastle",
    "stable",
    "faemarket_2",
    "ruin",
    "faemarket_3"
  ];
  let gameState;

  const saved = localStorage.getItem("gameState");

  if (saved) {
    gameState = JSON.parse(saved);
  } else {
    gameState = {
      mode: "main",
      progress: 0
    };

    localStorage.setItem("gameState", JSON.stringify(gameState));
  }
  // MODE TOGGLE BUTTON
  const toggleBtn = document.getElementById("modeToggle");

  function updateButton() {
    toggleBtn.textContent =
      gameState.mode === "main" ? "Mode: Main Story" : "Mode: Side Story";
  }

  function getBaseScene(scene) {
    return scene.split("_")[0];
  }

  function updateMapState() {

    const isComplete = gameState.progress >= mainStoryOrder.length;

    const currentMQ = mainStoryOrder[gameState.progress];
    const currentBase = currentMQ ? getBaseScene(currentMQ) : null;

    document.querySelectorAll(".mapbtn").forEach(btn => {

      if (btn.classList.contains("navbtn")) return;

      const scene = btn.dataset.scene;

      btn.classList.remove("locked", "unlocked");

      if (gameState.mode === "main") {

        if (isComplete) {

          const lastMQ = mainStoryOrder[mainStoryOrder.length - 1];
          const lastBase = getBaseScene(lastMQ);

          if (scene === lastBase) {
            btn.classList.add("unlocked");
          } else {
            btn.classList.add("locked");
          }
        }

        else if (scene === currentBase) {
          btn.classList.add("unlocked");
        }

        else {
          btn.classList.add("locked");
        }

      } else {
        btn.classList.add("unlocked");
      }

    });
  }



  toggleBtn.addEventListener("click", () => {
    gameState.mode = gameState.mode === "main" ? "side" : "main";

    localStorage.setItem("gameState", JSON.stringify(gameState));

    updateButton();
    updateMapState();
  });

  updateButton();
  updateMapState();

  const storyTriggers = {
    festival: [
      { unlockAt: 5, scene: "festival_1" },
      { unlockAt: 6, scene: "festival_2" }
    ],
    faemarket: [
      { unlockAt: 4, scene: "faemarket_1" },
      { unlockAt: 9, scene: "faemarket_2" },
      { unlockAt: 11, scene: "faemarket_3" }
    ]
  };

  updateButton();
  // LOCATION HANDLER
  function handleLocation(scene) {

    if (gameState.mode === "main") {

      if (storyTriggers[scene]) {

        const versions = storyTriggers[scene];
        let selectedScene = versions[0].scene;

        versions.forEach(v => {
          if (gameState.progress >= v.unlockAt) {
            selectedScene = v.scene;
          }
        });

        window.location.href = `story.html?type=main&scene=${selectedScene}`;
        return;
      }

      const currentMQ = mainStoryOrder[gameState.progress];

      if (scene === currentMQ) {
        window.location.href = `story.html?type=main&scene=${scene}`;
      } else {
        alert("You haven't unlocked this yet!");
      }

    } else {
      window.location.href = `story.html?type=side&scene=${scene}`;
    }
  }
</script>

</html>
