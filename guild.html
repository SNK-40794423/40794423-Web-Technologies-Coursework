<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight Eyes and The Black Seal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="imgs/icons/Zari.png">
</head>

<body class="bodyGuild">
    <audio id="cityOst" autoplay loop>
        <source src="ost/The Nightingale.mp3" type="audio/mp3">
    </audio>
    <button class="nav" id="musicBtn" onclick="toggleMusic()">Mute</button>
    <br> <br>
    <button class="nav mode" id="modeToggle">Main Story</button>

    <div class="mapbtn navbtn getOut">
        <a href="city.html">
            <button class="label">
                <img class="icons" src="imgs/icons/door.png" alt="">
                <br>To City</button>
        </a>
    </div>

    <div class="mapbtn quest" data-scene="quest" onclick="handleLocation('quest')">
        <button class="label">
            <img class="icons" src="imgs/icons/book_syokendai.png" alt=""><br>
            Quest</button>
    </div>

    <div class="mapbtn store" data-scene="store" onclick="handleLocation('guildStore')">
        <button class="label">
            <img class="icons" src="imgs/icons/kaizoku_takarabako.png" alt=""><br>
            Store</button>
    </div>

    <div class="mapbtn canteen" data-scene="canteen" onclick="handleLocation('canteen')">
        <button class="label">
            <img class="icons" src="imgs/icons/chuuka_turntable_yamucha.png" alt=""><br>
            Canteen</button>
    </div>
</body>
<script>
    const audio = document.getElementById("cityOst");
    const button = document.getElementById("musicBtn");
    audio.volume = 0.5;
    function toggleMusic() {
        audio.muted = !audio.muted;
        button.textContent = audio.muted ? "Unmute" : "Mute";
        music.pause();
    }
    // STORY ORDER
    const mainStoryOrder = [
        "inn",
        "quest",
        "townsquare",
        "ravine",
        "faemarket_1",
        "festival_1",
        "festival_2",
        "faecastle",
        "stable",
        "faemarket_2",
        "ruin",
        "faemarket_3"
    ];
    let gameState;

    const saved = localStorage.getItem("gameState");

    if (saved) {
        gameState = JSON.parse(saved);
    } else {
        gameState = {
            mode: "main",
            progress: 0
        };

        localStorage.setItem("gameState", JSON.stringify(gameState));
    }
    // MODE TOGGLE BUTTON
    const toggleBtn = document.getElementById("modeToggle");

    function updateButton() {
        toggleBtn.textContent =
            gameState.mode === "main" ? "Mode: Main Story" : "Mode: Side Story";
    }

    function updateMapState() {

        const currentMQ = mainStoryOrder[gameState.progress];

        document.querySelectorAll(".mapbtn").forEach(btn => {

            if (btn.classList.contains("navbtn")) return;

            const scene = btn.dataset.scene;

            btn.classList.remove("locked", "unlocked");

            if (gameState.mode === "main") {

                if (scene === currentMQ) {
                    btn.classList.add("unlocked");
                } else {
                    btn.classList.add("locked");
                }

            } else {
                btn.classList.add("unlocked");
            }

        });
    }



    toggleBtn.addEventListener("click", () => {
        gameState.mode = gameState.mode === "main" ? "side" : "main";

        localStorage.setItem("gameState", JSON.stringify(gameState));

        updateButton();
        updateMapState();
    });

    updateButton();
    updateMapState();

    // LOCATION HANDLER
    function handleLocation(scene) {

        if (gameState.mode === "main") {

            const currentMQ = mainStoryOrder[gameState.progress];

            if (scene === currentMQ) {
                window.location.href = `story.html?type=main&scene=${scene}`;
            } else {
                alert("You haven't unlocked this yet!");
            }

        } else {
            window.location.href = `story.html?type=side&scene=${scene}`;
        }
    }
</script>

</html>
