<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eight Eyes and The Black Seal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="imgs/icons/Zari.png">
</head>

<body class="bodyForest">
  <audio id="cityOst" autoplay loop>
    <source src="ost/Cobblestone_Village.mp3" type="audio/mp3">
  </audio>

  <button class="nav" id="musicBtn" onclick="toggleMusic()">Mute</button>
  <button class="nav mode" id="modeToggle">Main Story</button>
  <br>
  <br>
  <br>

  <!-- City Redirectory -->
  <div class="mapbtn navbtn toCity">
    <a href="city.html">
      <button class="label">
        <img class="icons" src="imgs/icons/buiding_iwate_ginkou.png" alt=""><br>
        To City</button>
    </a>
  </div>

  <!-- Lake -->
  <div class="mapbtn lake" data-scene="lake" onclick="handleLocation('lake')">
    <button class="label">
      <img class="icons" src="imgs/icons/mizuumi.png" alt=""> <br>
      Lake</button>
  </div>

  <!-- Faee Redirectory -->
  <div class="mapbtn navbtn faee">
    <a href="faee.html"> <br>
      <button class="label"><img class="icons" src="imgs/icons/gaisenmon.png" alt="">
        <br>To Faee</button>
    </a>
  </div>

  <!-- Ravine -->
  <div class="mapbtn ravine" data-scene="ravine" onclick="handleLocation('ravine')">
    <button class="label">
      <img class="icons" src="imgs/icons/yama_kiri.png" alt=""><br>
      Ravine</button>
  </div>

  <!-- Dungeon -->
  <div class="mapbtn navbtn dungeon">
    <a href="battle.html">
      <button class="label">
        <img class="icons" src="imgs/icons/mon_gate_western_close.png" alt=""><br>
        Dungeon
      </button>
    </a>
  </div>

</body>
<script>
  // Loads the ost for the website
  const audio = document.getElementById("cityOst");
  const button = document.getElementById("musicBtn");
  audio.volume = 0.5;
  function toggleMusic() {
    audio.muted = !audio.muted;
    button.textContent = audio.muted ? "Unmute" : "Mute";
    audio.pause();
  }
  // Stoary Order
  const mainStoryOrder = [
    "inn",
    "quest",
    "townsquare",
    "ravine",
    "faemarket_1",
    "festival_1",
    "festival_2",
    "faecastle",
    "stable",
    "faemarket_2",
    "ruin",
    "faemarket_3"
  ];
  let gameState;

  const saved = localStorage.getItem("gameState");

  if (saved) {
    gameState = JSON.parse(saved);
  } else {

    gameState = {
      mode: "main",
      progress: 0
    };

    localStorage.setItem("gameState", JSON.stringify(gameState));
  }
  // Change story mode
  const toggleBtn = document.getElementById("modeToggle");

  function updateButton() {
    toggleBtn.textContent =
      gameState.mode === "main" ? "Mode: Main Story" : "Mode: Side Story";
  }

  // Gray out the non active story nodes
  function updateMapState() {

    const currentMQ = mainStoryOrder[gameState.progress];

    document.querySelectorAll(".mapbtn").forEach(btn => {

      if (btn.classList.contains("navbtn")) return;

      const scene = btn.dataset.scene;

      btn.classList.remove("locked", "unlocked");

      if (gameState.mode === "main") {

        if (scene === currentMQ) {
          btn.classList.add("unlocked");
        } else {
          btn.classList.add("locked");
        }

      } else {
        btn.classList.add("unlocked");
      }

    });
  }



  toggleBtn.addEventListener("click", () => {
    gameState.mode = gameState.mode === "main" ? "side" : "main";

    localStorage.setItem("gameState", JSON.stringify(gameState));

    updateButton();
    updateMapState();
  });

  updateButton();
  updateMapState();
  // Handles Location
  function handleLocation(scene) {

    if (gameState.mode === "main") {

      const currentMQ = mainStoryOrder[gameState.progress];

      if (scene === currentMQ) {
        window.location.href = `story.html?type=main&scene=${scene}`;
      } else {
        alert("You haven't unlocked this yet!");
      }

    } else {
      window.location.href = `story.html?type=side&scene=${scene}`;
    }
  }
</script>

</html>
