<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eight Eyes and The Black Seal</title>
  <link rel="stylesheet" href="css/battleStyle.css">
  <link rel="icon" type="image/x-icon" href="imgs/icons/Zari.png">
</head>
<body>
    <div class="container">
        <div class="enemy">
            <img class="enemyImg" src="" alt="enemy.png">
            <p class="stat" id="EnemyHP"></p>
        </div>

        <div class="player">
            <img class="playerImg" src="" alt="player.png">
            <p class="stat" id="PlayerHP"></p>
        </div>


<hr>

<div class="battleEvent">
<p id="DiceRoll"></p>
<p id="EventResult"></p>
<p id="DealDamage"></p>
<p id="FinalResult"></p>
</div>


<button class="dice" id="rollBtn">Roll</button>
<button class="victory" id="return" style="display: none;">VICTORY</button>

</div>

</body>
</html>
<script src="js/battle.js"></script>
