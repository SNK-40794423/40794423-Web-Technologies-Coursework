<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eight Eyes and The Black Seal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="imgs/icons/Zari.png">
</head>

<body class="bodyCity">
  <audio id="cityOst" autoplay loop>
    <source src="ost/ArdSkelligVillage.mp3" type="audio/mp3">
  </audio>

  <button class="nav" id="musicBtn" onclick="toggleMusic()">Mute</button>
  <br> <br>
  <a href="index.html"><button class="nav">Index</button></a> <br><br>
  <a href="city.html"><button class="nav" id="reset" onclick="resetStory()">Reset Story</button></a>
  <br> <br>

  <button class="nav mode" id="modeToggle">Main Story</button>

  <!-- Castle -->
  <div class="mapbtn castle" data-scene="castle" onclick="handleLocation('castle')">
    <button class="label">
      <img class="icons" src="imgs/icons/building_europe_kojou.png" alt=""> <br>
      Castle</button>
  </div>

  <!-- Guild -->
  <div class="mapbtn navbtn guild">
    <a href="guild.html">
      <button class="label">
        <img class="icons" src="imgs/icons/city_kabukichou.png" alt=""> <br>
        Guild</button></a>
  </div>

  <!-- Inn -->
  <div class="mapbtn inn" data-scene="inn" onclick="handleLocation('inn')">
    <button class="label">
      <img class="icons" src="imgs/icons/building_japan_kayabuki.png"><br>
      Inn</button>
  </div>

  <!-- Market -->
  <div class="mapbtn market" data-scene="market" onclick="handleLocation('market')">
    <button class="label">
      <img class="icons" src="imgs/icons/ichiba_marusye.png" alt=""> <br>
      Market</button>
  </div>

  <!-- TownSquare -->
  <div class="mapbtn town" data-scene="townsquare" onclick="handleLocation('townsquare')">
    <button class="label">
      <img class="icons" src="imgs/icons/funsui.png" alt=""> <br>
      TownSquare</button>
  </div>

  <!-- Forest -->
  <div class="mapbtn navbtn forest">
    <a href="forest.html"><button class="label">
        <img class="icons" src="imgs/icons/mori.png" alt=""><br>To Forest</button></a>
  </div>

  <!-- Port -->
  <div class="mapbtn port" data-scene="port" onclick="handleLocation('port')">
    <button class="label">
      <img class="icons" src="imgs/icons/ship_nanpasen.png" alt=""> <br>
      Port</button>
  </div>

  <!-- Garden -->
  <div class="mapbtn garden" data-scene="garden" onclick="handleLocation('garden')">
    <button class="label">
      <img class="icons" src="imgs/icons/bg_natural_flower.jpg" alt=""> <br>
      Garden</button>
  </div>

  <script>
    // Loads the ost for the website
    const audio = document.getElementById("cityOst");
    const button = document.getElementById("musicBtn");
    audio.volume = 0.5;
    function toggleMusic() {
      audio.muted = !audio.muted;
      button.textContent = audio.muted ? "Unmute" : "Mute";
      audio.pause();
    }
    // Stoary Order
    const mainStoryOrder = [
      "inn",
      "quest",
      "townsquare",
      "ravine",
      "faemarket_1",
      "festival_1",
      "festival_2",
      "faecastle",
      "stable",
      "faemarket_2",
      "ruin",
      "faemarket_3"
    ];
    let gameState;

    const saved = localStorage.getItem("gameState");

    if (saved) {
      gameState = JSON.parse(saved);
    } else {
      // If played for first time
      gameState = {
        mode: "main",
        progress: 0
      };

      localStorage.setItem("gameState", JSON.stringify(gameState));
    }
    // Change story mode
    const toggleBtn = document.getElementById("modeToggle");

    function updateButton() {
      toggleBtn.textContent =
        gameState.mode === "main" ? "Mode: Main Story" : "Mode: Side Story";
    }

    // Gray out the non active story nodes
    function updateMapState() {

      const currentMQ = mainStoryOrder[gameState.progress];

      document.querySelectorAll(".mapbtn").forEach(btn => {

        if (btn.classList.contains("navbtn")) return;

        const scene = btn.dataset.scene;

        btn.classList.remove("locked", "unlocked");

        if (gameState.mode === "main") {

          if (scene === currentMQ) {
            btn.classList.add("unlocked");
          } else {
            btn.classList.add("locked");
          }

        } else {
          btn.classList.add("unlocked");
        }

      });
    }



    toggleBtn.addEventListener("click", () => {
      gameState.mode = gameState.mode === "main" ? "side" : "main";

      localStorage.setItem("gameState", JSON.stringify(gameState));

      updateButton();
      updateMapState();
    });

    updateButton();
    updateMapState();

    // Handles Location
    function handleLocation(scene) {

      if (gameState.mode === "main") {

        const currentMQ = mainStoryOrder[gameState.progress];

        if (scene === currentMQ) {
          window.location.href = `story.html?type=main&scene=${scene}`;
        } else {
          alert("You haven't unlocked this yet!");
        }

      } else {
        window.location.href = `story.html?type=side&scene=${scene}`;
      }
    }
    function resetStory() {
      localStorage.clear();
    }
  </script>
</body>

</html>
